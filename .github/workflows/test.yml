name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # the project targets the current Python and requires it
                python-version: ["3.14"]
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install (CPU-only torch, to keep the runner light)
              run: |
                  python -m pip install --upgrade pip
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install -e ".[test,cli]"

            # No dataset is downloaded in CI: the data is third-party and
            # non-commercially licensed, so the suite runs data-free by design.
            - name: Run the data-free suite
              run: pytest
